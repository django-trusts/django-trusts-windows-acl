[project]
name = "django-trusts-windows-acl"
version = "0.1.0.dev0"
description = "Relational Windows filesystem DACL reference implementation for django-trusts"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "BeeDesk, Inc." }]
requires-python = ">=3.12"
dependencies = [
    "Django>=6.1,<6.2",
    "django-trusts>=1.0.0.dev3,<2",
    "dj-database-url>=2.3.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
test = []

[tool.setuptools.packages.find]
include = ["config*", "winfs*"]
