[project]
name = "django-trusts-windows-acl"
version = "0.1.0.dev0"
description = "Bounded Windows filesystem DACL evaluator that validates django-trusts Context"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.1,<6.2",
    "django-trusts @ git+https://github.com/django-trusts/django-trusts.git@bfd55e23a9c7706271e3560c0ee1804023f1e69f",
    "dj-database-url>=2.3.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
test = []

[tool.setuptools.packages.find]
include = ["config*", "winfs*"]
