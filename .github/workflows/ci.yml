name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  winfs-postgres:
    name: winfs AccessCheck (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: winfs
          POSTGRES_PASSWORD: winfs
          POSTGRES_DB: winfs
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U winfs -d winfs"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgres://winfs:winfs@127.0.0.1:5432/winfs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Django 6.1, final core pin, and this package
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Django>=6.1,<6.2" dj-database-url "psycopg[binary]>=3.2"
          PIN=$(tr -d '[:space:]' < scripts/django-trusts.pin)
          python -m pip install "django-trusts @ git+https://github.com/django-trusts/django-trusts.git@${PIN}"
          python -m pip install -e .
      - name: Django system checks
        run: python manage.py check
      - name: winfs matrix, core proofs, plans, and schema
        run: python manage.py test winfs
      - name: Migrate and seed_winfs
        run: |
          python manage.py migrate --noinput
          python manage.py seed_winfs
