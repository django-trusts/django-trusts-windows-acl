[project]
name = "django-trusts-windows-acl"
version = "0.1.0.dev0"
description = "Bounded Windows filesystem DACL evaluator on final django-trusts core"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.1,<6.2",
    "django-trusts>=1.0.0.dev3,<2",
    "dj-database-url>=2.3.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
test = []

[tool.setuptools.packages.find]
include = ["config*", "winfs*"]
